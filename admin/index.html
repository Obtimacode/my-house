<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchCall - Full Admin Logs</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #05070f;
            --card-bg: rgba(13, 18, 33, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #0066ff;
            --danger-red: #ef4444;
            --success-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% -20%, #111e3b 0%, #05070f 70%);
        }

        .admin-container { max-width: 1100px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-blue);
        }

        .search-container { margin-bottom: 20px; }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
            transition: border-color 0.2s;
        }

        .search-input:focus { border-color: var(--accent-blue); }

        .auth-card {
            max-width: 400px;
            margin: 100px auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(20px);
        }

        .auth-card input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            margin: 15px 0;
            text-align: center;
            outline: none;
        }

        .auth-card button {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .rooms-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .room-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .room-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .room-id-tag {
            font-size: 14px;
            font-weight: 800;
            color: var(--success-green);
            direction: ltr;
        }

        .room-link-btn {
            background: rgba(0, 102, 255, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(0, 102, 255, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            direction: ltr;
        }

        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 13px;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .msg-content {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 12px;
            width: 100%;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .msg-sender { font-weight: 800; color: var(--accent-blue); font-size: 13px; }
        .msg-time { font-size: 11px; color: var(--text-muted); }
        .msg-text { color: var(--text-main); font-weight: 600; word-break: break-word; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-card">
        <i data-lucide="shield-check" style="width: 48px; height: 48px; color: var(--accent-blue); margin-bottom: 10px;"></i>
        <h2>لوحة تحكم الأدمن الشاملة</h2>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 5px;">أدخل كلمة السر لعرض كاع السجلات والرابطات</p>
        <input type="password" id="admin-pass" placeholder="كلمة السر...">
        <button id="btn-login">دخول الصفحة</button>
    </div>

    <div id="dashboard-screen" class="admin-container" style="display: none;">
        <div class="header">
            <h1><i data-lucide="database"></i> كاع المحادثات والغرف المسجلة</h1>
            <span id="active-rooms-count" style="font-size: 12px; font-weight: 700; background: rgba(16, 185, 129, 0.1); color: var(--success-green); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2);">0 غرف</span>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 بحث بالرابط، اسم المستخدم، Room ID أو النص...">
        </div>

        <div id="rooms-container" class="rooms-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://my-house-672f0-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const SECRET_PASS = "123456"; 
        let rawChatsData = null;

        lucide.createIcons();

        document.getElementById('btn-login').addEventListener('click', checkAuth);
        document.getElementById('admin-pass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAuth();
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            filterAndRenderChats(e.target.value.trim().toLowerCase());
        });

        function checkAuth() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === SECRET_PASS) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                loadAllChats();
            } else {
                alert('كلمة السر غير صحيحة!');
            }
        }

        function sanitizeInput(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                switch (m) {
                    case '&': return '&amp;';
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '"': return '&quot;';
                    case "'": return '&#x27;';
                    default: return m;
                }
            }).trim();
        }

        function loadAllChats() {
            onValue(ref(db, 'chats'), (snapshot) => {
                if (!snapshot.exists()) {
                    rawChatsData = null;
                    filterAndRenderChats('');
                    return;
                }
                rawChatsData = snapshot.val();
                const currentSearchTerm = document.getElementById('search-input').value.trim().toLowerCase();
                filterAndRenderChats(currentSearchTerm);
            });
        }

        function filterAndRenderChats(searchTerm) {
            const container = document.getElementById('rooms-container');
            const countBadge = document.getElementById('active-rooms-count');

            if (!rawChatsData) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 14px;">لا توجد أي محادثات محفوظة في Firebase حالياً.</p>';
                countBadge.innerText = '0 غرف';
                return;
            }

            const roomKeys = Object.keys(rawChatsData);
            countBadge.innerText = `${roomKeys.length} غرف مسجلة بالكامل`;
            container.innerHTML = '';

            let renderedRoomsCount = 0;

            roomKeys.forEach((roomKey) => {
                const roomMsgs = rawChatsData[roomKey];
                const fullRoomUrl = `https://watchcall.site/?room=${roomKey}`;
                const roomMatchesSearch = roomKey.toLowerCase().includes(searchTerm) || fullRoomUrl.toLowerCase().includes(searchTerm);

                const matchingMsgKeys = Object.keys(roomMsgs).filter((msgId) => {
                    const m = roomMsgs[msgId];
                    const senderMatch = m.sender && m.sender.toLowerCase().includes(searchTerm);
                    const textMatch = m.text && m.text.toLowerCase().includes(searchTerm);
                    return roomMatchesSearch || senderMatch || textMatch;
                });

                if (matchingMsgKeys.length > 0) {
                    renderedRoomsCount++;
                    const roomCard = document.createElement('div');
                    roomCard.className = 'room-card';

                    let msgsHTML = '';
                    matchingMsgKeys.forEach((msgId) => {
                        const m = roomMsgs[msgId];
                        const dateObj = m.timestamp ? new Date(m.timestamp) : null;
                        const timeStr = dateObj ? `${dateObj.toLocaleDateString()} - ${dateObj.toLocaleTimeString()}` : '';

                        msgsHTML += `
                            <div class="msg-item">
                                <img class="msg-avatar" src="${m.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=default'}">
                                <div class="msg-content">
                                    <div class="msg-header">
                                        <span class="msg-sender">${sanitizeInput(m.sender)}</span>
                                        <span class="msg-time">${timeStr}</span>
                                    </div>
                                    <div class="msg-text">${sanitizeInput(m.text)}</div>
                                </div>
                            </div>
                        `;
                    });

                    roomCard.innerHTML = `
                        <div class="room-header-info">
                            <div>
                                <span class="room-id-tag">ROOM ID: ${sanitizeInput(roomKey)}</span>
                                <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px; direction: ltr;">
                                    الرابط المباشر للغرفة: <a href="${fullRoomUrl}" target="_blank" style="color: var(--accent-blue); text-decoration: underline;">${fullRoomUrl}</a>
                                </div>
                            </div>
                            <a href="${fullRoomUrl}" target="_blank" class="room-link-btn">
                                <i data-lucide="external-link" style="width: 14px; height: 14px;"></i> دخول الغرفة
                            </a>
                        </div>
                        <div class="messages-list">${msgsHTML}</div>
                    `;
                    container.appendChild(roomCard);
                }
            });

            if (renderedRoomsCount === 0 && searchTerm !== '') {
                container.innerHTML = `<p style="color: var(--text-muted); font-size: 14px;">ما لقينا حتى نتيجة للبحث: "${sanitizeInput(searchTerm)}"</p>`;
            }

            lucide.createIcons();
        }
    </script>
</body>
</html>
