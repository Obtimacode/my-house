<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchCall - Stream & Voice</title>
  <style>
    :root {
      --bg-dark: #0b0d12;
      --card-bg: rgba(22, 27, 38, 0.75);
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #6366f1;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }

    /* 1. شاشة البث العلوي */
    .stream-container {
      width: 100%;
      height: 48%;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stream-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .stream-overlay-info {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: #e5e7eb;
    }

    /* 2. شبكة المشاركين - البروفايلات الفاخرة */
    .participants-grid {
      width: 100%;
      height: 38%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      align-items: center;
      justify-content: center;
    }

    .user-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.3s ease;
    }

    /* صورة البروفايل */
    .avatar-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* الإطار الأخضر عند التحدث (Speaking Indicator) */
    .user-card.speaking .avatar-wrapper {
      box-shadow: 0 0 0 4px var(--accent-green), 0 0 20px rgba(34, 197, 94, 0.5);
      animation: pulse-border 1.5s infinite alternate;
    }

    @keyframes pulse-border {
      0% {
        box-shadow: 0 0 0 3px var(--accent-green), 0 0 10px rgba(34, 197, 94, 0.3);
      }
      100% {
        box-shadow: 0 0 0 5px var(--accent-green), 0 0 24px rgba(34, 197, 94, 0.6);
      }
    }

    /* اسم المستخدم وأيقونة المايك المغلق */
    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 14px;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .mic-status-icon {
      width: 16px;
      height: 16px;
      fill: var(--accent-green);
    }

    .user-card.muted .mic-status-icon {
      fill: var(--accent-red);
    }

    /* 3. شريط التحكم السفلي */
    .controls-bar {
      height: 70px;
      background: rgba(18, 22, 31, 0.9);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: fit-content;
      margin: 0 auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    .control-btn.active-off {
      background: rgba(239, 68, 68, 0.2);
      color: var(--accent-red);
    }

    .control-btn.end-call {
      background: var(--accent-red);
      color: #fff;
      width: 60px;
      border-radius: 20px;
    }

    .control-btn.end-call:hover {
      background: #dc2626;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
    }

    .control-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* نقطة التنبيه للرسائل الجديدة */
    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 10px;
      height: 10px;
      background-color: var(--accent-purple);
      border-radius: 50%;
      border: 2px solid var(--bg-dark);
    }

    /* 4. النافذة المنزلقة للشات (Chat Drawer) */
    .chat-drawer {
      position: fixed;
      top: 0;
      right: -380px; /* مخفي خارج الشاشة */
      width: 350px;
      height: 100%;
      background: rgba(15, 18, 25, 0.95);
      backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.6);
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .chat-drawer.open {
      right: 0; /* إظهار النافذة */
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .chat-header h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .close-chat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 20px;
    }

    .close-chat-btn:hover {
      color: var(--text-main);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-msg {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
    }

    .chat-msg .sender {
      font-weight: 600;
      color: var(--accent-purple);
      margin-bottom: 4px;
      display: block;
    }

    .chat-input-container {
      display: flex;
      gap: 8px;
      padding-top: 10px;
    }

    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 10px 14px;
      color: var(--text-main);
      outline: none;
      font-size: 13px;
    }

    .chat-input:focus {
      border-color: var(--accent-purple);
    }

    .send-btn {
      background: var(--accent-purple);
      border: none;
      border-radius: 14px;
      width: 42px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }
  </style>
</head>
<body>

  <!-- 1. شاشة البث -->
  <div class="stream-container">
    <img class="stream-video" src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1000" alt="Stream Preview">
    <div class="stream-overlay-info">🎥 بث المباشر - WatchCall</div>
  </div>

  <!-- 2. شبكة البروفايلات (كبار وأنيقين) -->
  <div class="participants-grid">
    
    <!-- بروفايل يتحدث (إطار أخضر مضيء) -->
    <div class="user-card speaking">
      <div class="avatar-wrapper">
        <img class="avatar-img" src="https://i.pravatar.cc/150?img=32" alt="User Avatar">
      </div>
      <div class="user-info">
        <span class="user-name">Angel</span>
        <!-- أيقونة مايك مفتوح -->
        <svg class="mic-status-icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg>
      </div>
    </div>

    <!-- بروفايل المايك مقفول -->
    <div class="user-card muted">
      <div class="avatar-wrapper">
        <img class="avatar-img" src="https://i.pravatar.cc/150?img=11" alt="User Avatar">
      </div>
      <div class="user-info">
        <span class="user-name">Hamada</span>
        <!-- أيقونة مايك مقفول -->
        <svg class="mic-status-icon" viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.27-1.48.42-2.31.42-3.41 0-6.29-2.4-6.75-5.7H3.5c.49 4.2 3.88 7.5 8 7.93V21h3v-2.07c1.37-.15 2.63-.64 3.7-1.4l2.03 2.03L21 18.27 4.27 3z"/></svg>
      </div>
    </div>

  </div>

  <!-- 3. شريط التحكم السفلي -->
  <div class="controls-bar">
    <!-- زر الكاميرا -->
    <button class="control-btn" title="الكاميرا">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    </button>

    <!-- زر المايك -->
    <button class="control-btn" title="المايك">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg>
    </button>

    <!-- زر فتح/إغلاق الشات -->
    <button class="control-btn" id="toggleChatBtn" title="المحادثة">
      <span class="badge"></span>
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
    </button>

    <!-- زر قطع المكالمة -->
    <button class="control-btn end-call" title="قطع المكالمة">
      <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
    </button>
  </div>

  <!-- 4. القائمة الجانبية للشات (Drawer) -->
  <div class="chat-drawer" id="chatDrawer">
    <div class="chat-header">
      <h3>المحادثة المباشرة 💬</h3>
      <button class="close-chat-btn" id="closeChatBtn">&times;</button>
    </div>

    <div class="chat-messages">
      <div class="chat-msg">
        <span class="sender">Angel</span>
        سلام! الفيديو خدام مزيان؟
      </div>
      <div class="chat-msg">
        <span class="sender">Hamada</span>
        إيه الصوت والصورة ناضيين 👌
      </div>
    </div>

    <div class="chat-input-container">
      <input type="text" class="chat-input" placeholder="اكتب رسالة...">
      <button class="send-btn">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- JavaScript لفتح وإغلاق الشات بسهولة -->
  <script>
    const chatDrawer = document.getElementById('chatDrawer');
    const toggleChatBtn = document.getElementById('toggleChatBtn');
    const closeChatBtn = document.getElementById('closeChatBtn');

    // فتح وإغلاق الشات
    toggleChatBtn.addEventListener('click', () => {
      chatDrawer.classList.toggle('open');
    });

    closeChatBtn.addEventListener('click', () => {
      chatDrawer.classList.remove('open');
    });
  </script>

</body>
</html>
