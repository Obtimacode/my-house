<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WatchCall - Sync Video & Voice Chat</title>

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer-when-downgrade">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="watchcall.png?v=3">
    <link rel="shortcut icon" href="watchcall.png?v=3" type="image/x-icon">
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4144779103451763" crossorigin="anonymous"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AeWZjpjao8UB0DNcL_Ahgo-fWMx6nJIEeGnswxdoDfmAU3yFY6PSz5OALcU5PBXKHF37B7iX1p07zO-8&currency=USD"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root {
            --bg-dark: #05070f;
            --card-bg: rgba(20, 24, 38, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #0066ff;
            --accent-hover: #0052cc;
            --danger-red: #ef4444;
            --success-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --square-card-bg: #121624;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% -20%, #111e3b 0%, #05070f 80%);
        }

        .toast-container {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            animation: slideUpFade 0.3s ease forwards;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .container { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 420px; 
            padding: 30px 24px; 
            border-radius: 28px; 
            border: 1px solid var(--card-border);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(20px);
            text-align: center; 
            margin: auto;
        }
        
        h1 { 
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 26px; 
            font-weight: 900; 
            margin-bottom: 8px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .online-counter-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: var(--success-green);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-green);
            border-radius: 50%;
        }

        .site-logo {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 50%;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        
        .avatar-picker { 
            position: relative; 
            width: 90px; 
            height: 90px; 
            margin: 0 auto 20px; 
            cursor: pointer; 
        }
        .avatar-picker img { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid var(--accent-blue); 
        }
        .avatar-picker input { display: none; }
        .avatar-overlay { 
            position: absolute; 
            bottom: 2px; 
            right: 2px; 
            background: var(--accent-blue); 
            padding: 6px; 
            border-radius: 50%; 
            color: white; 
            display: flex; 
            border: 2px solid #0d1221;
        }
        
        input[type="text"] { 
            width: 100%; 
            padding: 12px 16px; 
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 14px; 
            color: white; 
            font-size: 14px; 
            font-weight: 700;
            margin-bottom: 16px; 
            outline: none; 
            text-align: center;
        }

        button { 
            width: 100%; 
            padding: 12px 16px; 
            background: var(--accent-blue); 
            border: none; 
            border-radius: 14px; 
            color: white; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover { background: var(--accent-hover); }
        
        #app-screen { display: none; }

        .my-code-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 16px;
        }
        .my-code-title {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .my-code-value {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: var(--accent-blue);
            letter-spacing: 3px;
        }

        .partner-found-card {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px;
            margin-top: 15px;
            align-items: center;
            justify-content: space-between;
        }

        /* --- FULL SCREEN CINEMA ROOM (MATCHING USER'S IMAGE EXACTLY) --- */
        #call-screen { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: #000000; 
            z-index: 1000; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding: 16px;
            overflow-y: auto;
        }

        .calling-state-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .cinema-room {
            width: 100%;
            max-width: 520px;
            display: none;
            flex-direction: column;
            gap: 16px;
            margin: auto 0;
        }

        /* TOP VIDEO CONTAINER WITH ROUNDED CORNERS */
        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0d111d;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #video-container iframe, #player {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-input-bar {
            display: flex;
            gap: 8px;
            margin-top: -4px;
        }
        .video-input-bar input {
            flex: 1;
            margin-bottom: 0;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12px;
        }
        .video-input-bar button {
            width: auto;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
        }

        /* SQUARE USER PROFILE CARDS GRID (EXACTLY LIKE THE IMAGE) */
        .profiles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
        }

        .square-profile-card {
            background: var(--square-card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .square-profile-card.speaking {
            border-color: var(--success-green);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .square-avatar-wrapper {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .square-avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .square-card-badges {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge-username {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .badge-status {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* FLOATING BOTTOM CONTROL BAR (MATCHING IMAGE) */
        .floating-controls-bar {
            width: 100%;
            max-width: 480px;
            background: rgba(22, 26, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 35px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            margin-top: 10px;
        }

        .btn-ctrl {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ctrl:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-ctrl.active { background: var(--accent-blue); }
        .btn-ctrl.danger { background: var(--danger-red); }

        /* CHAT DRAWER PANEL */
        .chat-drawer {
            position: fixed;
            top: 0;
            right: -360px;
            width: 320px;
            height: 100%;
            background: rgba(10, 14, 24, 0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
            transition: right 0.3s ease;
            z-index: 2000;
            display: flex;
            flex-direction: column;
        }

        .chat-drawer.open { right: 0; }

        .chat-header {
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            font-size: 14px;
            font-weight: 800;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-msg {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13px;
        }

        .chat-msg img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-msg-body {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
        }

        .chat-input-row {
            display: flex;
            padding: 12px;
            background: #05070f;
            gap: 8px;
        }
        .chat-input-row input { margin-bottom: 0; }
        .chat-input-row button { width: auto; padding: 10px 16px; }

        .site-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* MEDIA QUERIES FOR DESKTOP STYLING */
        @media (min-width: 768px) {
            .cinema-room {
                max-width: 850px;
            }
            .square-avatar-wrapper {
                width: 105px;
                height: 105px;
            }
        }
    </style>
</head>
<body>

    <div id="toast-container" class="toast-container"></div>

    <div class="container" id="main-container">
        <!-- LOGIN SCREEN -->
        <div id="login-screen">
            <h1>
                <img src="watchcall.png" alt="Logo" class="site-logo">
                <span>WatchCall</span>
                <span class="online-counter-badge">
                    <span class="pulse-dot"></span>
                    <span id="active-online-count">1</span>
                </span>
            </h1>
            <p class="subtitle">Watch YouTube synchronized with high quality voice chat</p>
            
            <div class="avatar-picker" onclick="document.getElementById('file-input').click()">
                <img id="avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=default" alt="Avatar">
                <div class="avatar-overlay"><i data-lucide="camera"></i></div>
                <input type="file" id="file-input" accept="image/*">
            </div>
            
            <input type="text" id="username" placeholder="Enter your nickname..." autocomplete="off" maxlength="15">
            <button id="btn-join"><i data-lucide="log-in"></i>Enter Room</button>
        </div>

        <!-- APP DASHBOARD -->
        <div id="app-screen">
            <h1>
                <img src="watchcall.png" alt="Logo" class="site-logo">
                <span>Your Room</span>
            </h1>
            <div class="my-code-panel">
                <div class="my-code-title">Your Connection Code</div>
                <div class="my-code-value" id="my-6digit-code">------</div>
            </div>

            <input type="text" id="target-code-input" placeholder="000 000" maxlength="7" autocomplete="off">
            <button id="btn-search-by-code"><i data-lucide="search"></i>Connect with Partner Code</button>

            <div class="partner-found-card" id="partner-found-card">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img id="found-avatar" src="" style="width: 40px; height: 40px; border-radius: 50%;">
                    <div id="found-name" style="font-weight: 800;">Partner Name</div>
                </div>
                <button id="btn-start-actual-call" style="width: auto; background: var(--success-green); padding: 8px 16px;">Call</button>
            </div>
        </div>
    </div>

    <!-- CALL ROOM SCREEN -->
    <div id="call-screen">
        <div class="calling-state-container" id="calling-state-view">
            <h3 id="call-user-name" style="font-size: 24px; margin-bottom: 8px;">Connecting...</h3>
            <p style="color: var(--text-muted); font-size: 14px;">Establishing peer-to-peer connection...</p>
        </div>

        <div class="cinema-room" id="cinema-room">
            <!-- TOP VIDEO CONTAINER -->
            <div class="video-box">
                <div id="video-container">
                    <div id="player"></div>
                </div>
            </div>

            <!-- YOUTUBE LINK SELECTOR -->
            <div class="video-input-bar">
                <input type="text" id="video-url" placeholder="Paste YouTube video link here...">
                <button id="btn-load-video"><i data-lucide="play"></i><span>Play</span></button>
            </div>

            <!-- SQUARE PROFILES GRID (EXACTLY AS THE PROVIDED IMAGE) -->
            <div class="profiles-grid">
                <!-- User Profile Square -->
                <div class="square-profile-card" id="card-local-user">
                    <div class="square-avatar-wrapper">
                        <img id="avatar-local-user" src="https://api.dicebear.com/7.x/bottts/svg?seed=default" alt="You">
                    </div>
                    <div class="square-card-badges">
                        <i data-lucide="mic" style="width: 12px; height: 12px;"></i>
                        <span class="badge-username" id="name-local-user">You</span>
                    </div>
                </div>

                <!-- Partner Profile Square -->
                <div class="square-profile-card" id="card-remote-user">
                    <div class="square-avatar-wrapper">
                        <img id="avatar-remote-user" src="https://api.dicebear.com/7.x/bottts/svg?seed=partner" alt="Partner">
                    </div>
                    <div class="square-card-badges">
                        <i data-lucide="mic" style="width: 12px; height: 12px;"></i>
                        <span class="badge-username" id="name-remote-user">Partner</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- SLIDING CHAT DRAWER -->
        <div class="chat-drawer" id="chat-drawer">
            <div class="chat-header">
                <span>Live Room Chat</span>
                <button id="btn-close-chat" style="background: transparent; width: auto; padding: 4px;"><i data-lucide="x"></i></button>
            </div>
            <div class="chat-messages" id="chat-box"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button id="btn-send-msg"><i data-lucide="send"></i></button>
            </div>
        </div>
        
        <!-- BOTTOM FLOATING CONTROLS BAR -->
        <div class="floating-controls-bar">
            <button class="btn-ctrl" id="btn-mute" title="Mute Mic"><i data-lucide="mic"></i></button>
            <button class="btn-ctrl" id="btn-toggle-chat" title="Open Chat" style="display: none;"><i data-lucide="message-square"></i></button>
            <button class="btn-ctrl" id="btn-accept" style="display: none; background: var(--success-green);"><i data-lucide="phone"></i></button>
            <button class="btn-ctrl danger" id="btn-hangup" title="End Call"><i data-lucide="phone-off"></i></button>
        </div>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, update, remove, get, push } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://my-house-672f0-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myId, myName, myAvatar = "https://api.dicebear.com/7.x/bottts/svg?seed=default";
        let my6DigitCode = "";
        let peer, localStream, currentCall, partnerId = null;
        let ytPlayer = null;
        let ignoreNextStateChange = false;
        let searchedPartner = null;

        lucide.createIcons();

        // Online Presence
        const activePresenceRef = push(ref(db, 'online_presence'));
        set(activePresenceRef, true);
        onDisconnect(activePresenceRef).remove();
        onValue(ref(db, 'online_presence'), (snapshot) => {
            const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 1;
            document.getElementById('active-online-count').innerText = count;
        });

        // Chat Toggle
        const chatDrawer = document.getElementById('chat-drawer');
        const btnToggleChat = document.getElementById('btn-toggle-chat');
        btnToggleChat.addEventListener('click', () => chatDrawer.classList.toggle('open'));
        document.getElementById('btn-close-chat').addEventListener('click', () => chatDrawer.classList.remove('open'));

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i data-lucide="info"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.remove(), 3000);
        }

        // Avatar Upload
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    myAvatar = event.target.result;
                    document.getElementById('avatar-preview').src = myAvatar;
                };
                reader.readAsDataURL(file);
            }
        });

        // Enter App
        document.getElementById('btn-join').addEventListener('click', async () => {
            myName = document.getElementById('username').value.trim();
            if(!myName) return showToast("Please write a nickname!");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (err) {
                return showToast("Microphone access is required!");
            }

            peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
            peer.on('open', async (id) => {
                myId = id;
                my6DigitCode = Math.floor(100000 + Math.random() * 900000).toString();

                await set(ref(db, 'users/' + myId), { name: myName, avatar: myAvatar, code: my6DigitCode });
                await set(ref(db, 'codes/' + my6DigitCode), { peerId: myId, name: myName, avatar: myAvatar });

                document.getElementById('my-6digit-code').innerText = my6DigitCode;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                
                listenForCalls();
            });
        });

        // Search Partner
        document.getElementById('btn-search-by-code').addEventListener('click', async () => {
            const rawCode = document.getElementById('target-code-input').value.replace(/\s+/g, '');
            const codeSnapshot = await get(ref(db, 'codes/' + rawCode));
            if (!codeSnapshot.exists()) return showToast("Code not found!");

            searchedPartner = codeSnapshot.val();
            document.getElementById('found-avatar').src = searchedPartner.avatar;
            document.getElementById('found-name').innerText = searchedPartner.name;
            document.getElementById('partner-found-card').style.display = 'flex';
        });

        document.getElementById('btn-start-actual-call').addEventListener('click', () => {
            if (!searchedPartner) return;
            startCall(searchedPartner.peerId, searchedPartner.name, searchedPartner.avatar);
        });

        function setupUI(partnerName, partnerAvatar) {
            document.getElementById('avatar-local-user').src = myAvatar;
            document.getElementById('name-local-user').innerText = myName;

            document.getElementById('avatar-remote-user').src = partnerAvatar || "https://api.dicebear.com/7.x/bottts/svg?seed=partner";
            document.getElementById('name-remote-user').innerText = partnerName || "Partner";
        }

        function startCall(targetId, targetName, targetAvatar) {
            partnerId = targetId;
            document.getElementById('btn-accept').style.display = 'none';
            document.getElementById('cinema-room').style.display = 'none';
            document.getElementById('btn-toggle-chat').style.display = 'none';
            document.getElementById('calling-state-view').style.display = 'flex';
            document.getElementById('call-screen').style.display = 'flex';

            setupUI(targetName, targetAvatar);
            currentCall = peer.call(targetId, localStream);
            handleCall(currentCall);

            setupSync();
            setupChat();
        }

        function listenForCalls() {
            peer.on('call', (incomingCall) => {
                currentCall = incomingCall;
                partnerId = incomingCall.peer;
                
                onValue(ref(db, 'users/' + partnerId), (snapshot) => {
                    const caller = snapshot.val();
                    if (caller) setupUI(caller.name, caller.avatar);
                }, { onlyOnce: true });

                document.getElementById('btn-accept').style.display = 'flex';
                document.getElementById('cinema-room').style.display = 'none';
                document.getElementById('btn-toggle-chat').style.display = 'none';
                document.getElementById('call-screen').style.display = 'flex';

                document.getElementById('btn-accept').onclick = () => {
                    currentCall.answer(localStream);
                    document.getElementById('btn-accept').style.display = 'none';
                    handleCall(currentCall);
                    setupSync();
                    setupChat();
                };
            });
        }

        function initYT(videoId = 'dQw4w9WgXcQ') {
            if (ytPlayer) try { ytPlayer.destroy(); } catch(e){}
            ytPlayer = new YT.Player('player', {
                videoId: videoId,
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (ignoreNextStateChange || !partnerId) return;
            const state = event.data;
            const currentTime = ytPlayer.getCurrentTime();

            if (state === YT.PlayerState.PLAYING) {
                update(ref(db, `calls/${myId}_${partnerId}/videoState`), { action: 'play', time: currentTime });
            } else if (state === YT.PlayerState.PAUSED) {
                update(ref(db, `calls/${myId}_${partnerId}/videoState`), { action: 'pause', time: currentTime });
            }
        }

        document.getElementById('btn-load-video').addEventListener('click', () => {
            const url = document.getElementById('video-url').value;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            const videoId = (match && match[2].length === 11) ? match[2] : null;
            if (videoId && partnerId) {
                set(ref(db, `calls/${myId}_${partnerId}/videoState`), { videoId: videoId, action: 'load', time: 0 });
            }
        });

        function setupSync() {
            initYT();
            onValue(ref(db, `calls/${myId}_${partnerId}/videoState`), (snapshot) => {
                if (!snapshot.exists() || !ytPlayer) return;
                const data = snapshot.val();
                ignoreNextStateChange = true;

                if (data.action === 'load') {
                    ytPlayer.loadVideoById(data.videoId, 0);
                } else if (data.action === 'play') {
                    ytPlayer.seekTo(data.time, true);
                    ytPlayer.playVideo();
                } else if (data.action === 'pause') {
                    ytPlayer.pauseVideo();
                    ytPlayer.seekTo(data.time, true);
                }
                setTimeout(() => ignoreNextStateChange = false, 500);
            });
        }

        function handleCall(call) {
            call.on('stream', (remoteStream) => {
                document.getElementById('calling-state-view').style.display = 'none';
                document.getElementById('cinema-room').style.display = 'flex';
                document.getElementById('btn-toggle-chat').style.display = 'flex';
                document.getElementById('remote-audio').srcObject = remoteStream;
            });
        }

        function setupChat() {
            const chatBox = document.getElementById('chat-box');
            onValue(ref(db, `chats/${myId}_${partnerId}`), (snapshot) => {
                if (!snapshot.exists()) return;
                chatBox.innerHTML = '';
                snapshot.forEach((child) => {
                    const msg = child.val();
                    chatBox.innerHTML += `
                        <div class="chat-msg">
                            <img src="${msg.avatar}">
                            <div class="chat-msg-body">
                                <div style="font-size: 11px; font-weight: 800; color: var(--accent-blue);">${msg.sender}</div>
                                <div>${msg.text}</div>
                            </div>
                        </div>`;
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        document.getElementById('btn-send-msg').addEventListener('click', async () => {
            const text = document.getElementById('chat-input').value.trim();
            if (!text || !partnerId) return;
            const msgData = { sender: myName, avatar: myAvatar, text: text };
            await push(ref(db, `chats/${myId}_${partnerId}`), msgData);
            await push(ref(db, `chats/${partnerId}_${myId}`), msgData);
            document.getElementById('chat-input').value = '';
        });

        document.getElementById('btn-hangup').addEventListener('click', () => {
            if (currentCall) currentCall.close();
            document.getElementById('call-screen').style.display = 'none';
            document.getElementById('remote-audio').srcObject = null;
        });

        let isMuted = false;
        document.getElementById('btn-mute').addEventListener('click', () => {
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('btn-mute').classList.toggle('active', isMuted);
        });
    </script>
</body>
</html>
